name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    outputs:
      version: ${{ steps.appversion.outputs.version }}
      short_hash: ${{ steps.appversion.outputs.short_hash }}
      sha256: ${{ steps.verify.outputs.sha256 }}
      cert_sha256: ${{ steps.verify.outputs.cert_sha256 }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          android-version: '36'
          build-tools-version: '36.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Resolve and validate version
        id: appversion
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          RESOLVED=$(./gradlew -q -PreleaseVersion="$VERSION" printVersionName)
          [[ "$RESOLVED" == "$VERSION" ]]
          SHORT_HASH=$(git rev-parse --short HEAD)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short_hash=$SHORT_HASH" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: ./gradlew testDebugUnitTest --build-cache

      - name: Decode keystore
        run: echo "$KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/release.keystore"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build release APK
        run: ./gradlew -PreleaseVersion="${{ steps.appversion.outputs.version }}" assembleRelease --build-cache
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK with version
        run: |
          set -euo pipefail
          mv app/build/outputs/apk/release/app-release.apk \
             "app/build/outputs/apk/release/wheelwitch-${VERSION}-${SHORT_HASH}.apk"
          mv app/build/outputs/apk/release/app-release.apk.idsig \
             "app/build/outputs/apk/release/wheelwitch-${VERSION}-${SHORT_HASH}.apk.idsig"
        env:
          VERSION: ${{ steps.appversion.outputs.version }}
          SHORT_HASH: ${{ steps.appversion.outputs.short_hash }}

      - name: Verify APK signatures and compute hash
        id: verify
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/wheelwitch-${VERSION}-${SHORT_HASH}.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          SHA256=$(sha256sum "$APK" | awk '{print $1}')
          CERT_SHA256=$(
            "$APKSIGNER" verify --print-certs "$APK" \
              | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}'
          )
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "cert_sha256=$CERT_SHA256" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ steps.appversion.outputs.version }}
          SHORT_HASH: ${{ steps.appversion.outputs.short_hash }}

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: wheelwitch-release-assets
          path: |
            app/build/outputs/apk/release/wheelwitch-${{ steps.appversion.outputs.version }}-${{ steps.appversion.outputs.short_hash }}.apk
            app/build/outputs/apk/release/wheelwitch-${{ steps.appversion.outputs.version }}-${{ steps.appversion.outputs.short_hash }}.apk.idsig
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v7
        with:
          name: wheelwitch-release-assets
          path: release-assets

      - name: Publish GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: WheelWitch ${{ needs.build.outputs.version }}
          generateReleaseNotes: true
          prerelease: false
          draft: false
          artifacts: |
            release-assets/wheelwitch-${{ needs.build.outputs.version }}-${{ needs.build.outputs.short_hash }}.apk
            release-assets/wheelwitch-${{ needs.build.outputs.version }}-${{ needs.build.outputs.short_hash }}.apk.idsig
          body: |
            ## WheelWitch ${{ needs.build.outputs.version }}

            - **Signing certificate SHA-256:** `${{ needs.build.outputs.cert_sha256 }}`
            - **APK SHA-256:** `${{ needs.build.outputs.sha256 }}`
            - [Verify with AppVerifier](https://github.com/soupslurpr/AppVerifier)
          token: ${{ secrets.GITHUB_TOKEN }}
